<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Energy Joe – Panel ohne Home Assistant</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      energy-joe-panel {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Zeigt das gebaute Panel mit einem nachgeahmten Home Assistant.
      Aufruf über einen lokalen Webserver im Repo-Wurzelverzeichnis, z. B.
      python3 -m http.server 8767  →  http://localhost:8767/panel/dev/
      Parameter: ?dark=1  ?lang=en  ?step=scan  ?done=1  ?page=settings  ?mode=off|advisory|live  ?sample=generic  ?audit=1  ?need=1
      sample-*.json kommen aus scripts/make_dev_samples.py (erfundene Haushalte aus tests/snapshots.py):
      Funde, die Konfiguration nach dem Übernehmen, ihre Prüfungen, Zustände und Register sowie
      zwei Wochen erfundener Verlauf mit festen Plänen, nachgespielten Nächten und dem, was Joe
      daraus gelernt hat (Seiten Übersicht, Plan, Historie, Lernen).
      ?done=1 startet mit übernommener Konfiguration.
      ?audit=1 rahmt jedes Bedienelement rot ein, das keinen Tooltip hat; joeAudit() in der
      Konsole listet sie auf. Ein Element gilt als erklärt, wenn es oder ein Vorfahr
      data-tipped (Container mit <joe-tip>) oder data-notip (reine Navigation) trägt.
    -->
    <energy-joe-panel></energy-joe-panel>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const sample = await (await fetch(`./sample-${params.get("sample") || "fronius"}.json`, { cache: "no-store" })).json();

      // Stand-ins for elements Home Assistant provides.
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          connectedCallback() {
            this.style.cssText =
              "display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);border-radius:50%;background:currentColor;opacity:.4";
          }
        },
      );
      customElements.define("ha-menu-button", class extends HTMLElement {});

      // The same merge rules as custom_components/energy_joe/model.py (simplified).
      const KEYED = ["batteries", "persons", "consumers", "actions"];
      const REPLACED = new Set([
        "grid_power",
        "home_power",
        "power",
        "controls",
        "mode_options",
        "window",
        "steps",
        "prepare",
        "consumption_model",
        "group_models",
        "presence",
        "solar_classes",
        "sources",
        "battery_models",
        "action_models",
        "reset",
        "alternatives",
      ]);
      const ITEM_DEFAULTS = {
        batteries: {
          power: null,
          capacity_kwh: null,
          capacity_entity: null,
          max_charge_w: null,
          max_discharge_w: null,
          device_id: null,
          controls: {},
          priority: 1,
        },
        persons: { person_entity: null, calendars: [] },
        consumers: { energy_entity: null, power_entity: null, included_in: null, source: "manual" },
        actions: { enabled: true, reset: "previous", reset_value: null, lead_min: 0, auto: true, conditions: [], priority: 1 },
      };
      const isDict = (v) => v && typeof v === "object" && !Array.isArray(v);
      const below = (other, path) => other.startsWith(`${path}.`) || other.startsWith(`${path}[`);
      const forget = (prov, path) =>
        Object.keys(prov)
          .filter((k) => below(k, path))
          .forEach((k) => delete prov[k]);
      const merge = (base, patch) => {
        for (const [k, v] of Object.entries(patch)) {
          if (isDict(v) && isDict(base[k]) && Object.keys(v).length && !REPLACED.has(k)) merge(base[k], v);
          else base[k] = structuredClone(v);
        }
        return base;
      };
      const leaves = (patch, prefix = "") =>
        Object.entries(patch).flatMap(([k, v]) =>
          isDict(v) && Object.keys(v).length && !REPLACED.has(k) ? leaves(v, `${prefix}${k}.`) : [`${prefix}${k}`],
        );
      const applyUpdate = (config, patch, source) => {
        const c = structuredClone(config);
        const prov = c.provenance;
        const paths = [];
        for (const [key, value] of Object.entries(patch)) {
          if (KEYED.includes(key) && isDict(value)) {
            for (const [id, change] of Object.entries(value)) {
              const prefix = `${key}[${id}]`;
              delete prov[prefix];
              const index = c[key].findIndex((item) => item.id === id);
              if (change === null) {
                if (index >= 0) c[key].splice(index, 1);
                forget(prov, prefix);
                paths.push(prefix);
              } else {
                if (index >= 0) merge(c[key][index], change);
                else c[key].push({ ...ITEM_DEFAULTS[key], ...structuredClone(change), id });
                const { id: _, ...fields } = change;
                paths.push(...leaves(fields, `${prefix}.`));
              }
            }
          } else if (KEYED.includes(key)) {
            c[key] = structuredClone(value);
            forget(prov, key);
            paths.push(key);
          } else {
            merge(c, { [key]: value });
            paths.push(...leaves({ [key]: value }));
          }
        }
        for (const path of paths) {
          forget(prov, path);
          prov[path] = { source, updated: new Date().toISOString() };
        }
        return c;
      };

      const done = params.get("done") === "1";
      const step = params.get("step") || "welcome";
      const state = {
        mode: params.get("mode") || "simulation",
        onboarding: { step, completed: done },
        config: structuredClone(done || ["questions", "done"].includes(step) ? sample.adopted_config : sample.default_config),
      };
      const history = sample.history;
      // Local time in Berlin (summer time) as Home Assistant would send it.
      const stamp = () => new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 19) + "+02:00";
      const bufferSource = () =>
        state.config.provenance["rules.buffer_factor"]?.source ?? state.config.provenance.rules?.source ?? "default";
      // With ?done=1 Joe has been learning for two weeks.
      if (done && history.learned) {
        state.config = applyUpdate(state.config, { learned: history.learned }, "learned");
        if (history.learned.buffer != null) {
          state.config = applyUpdate(state.config, { rules: { buffer_factor: history.learned.buffer } }, "learned");
        }
      }
      state.results = done ? history.results : null;
      state.questions = done ? structuredClone(history.learning.questions) : [];
      // Steering: test runs, log and why Joe steers or not (control/executor.py).
      const control = { tests: {}, log: [], skip: null, answer: null, testing: null, tonight: {} };
      const controlView = () => {
        const night = state.plan?.window?.start ?? null;
        const reason =
          state.mode === "simulation" || state.mode === "off"
            ? state.mode
            : !state.plan || state.plan.kind === "unavailable"
              ? "no_plan"
              : control.skip === night
                ? "skipped"
                : state.mode === "advisory" && control.answer?.night !== night
                  ? "unanswered"
                  : state.mode === "advisory" && !control.answer?.yes
                    ? "declined"
                    : "waiting";
        const ready = Object.fromEntries(
          state.config.batteries.map((b) => [
            b.id,
            b.adapter === "none" ? "not_controllable" : control.tests[b.id]?.ok ? "ready" : "not_tested",
          ]),
        );
        return { steering: false, reason, night, batteries: {}, actions: {}, pending: false, ready, ...control };
      };
      const log = (kind, detail = {}) => {
        control.log.push({ at: stamp(), kind, ...detail });
        control.log = control.log.slice(-100);
      };
      const watching = () => ({
        active: true,
        since: "2026-10-01T09:12:00+02:00",
        last_hour: "2026-10-03T14:00:00+02:00",
        first_day: history.first_day,
        last_day: history.last_day,
        day_count: history.day_count,
        backfill: { state: "done", hours: 312 },
      });
      state.observe = done && state.mode !== "off" ? watching() : { active: false, backfill: { state: "idle" } };
      // ?need=1: the car charges by need (the night computed with made-up trips).
      if (params.get("need") === "1" && history.plan_need) {
        history.plan = history.plan_need;
        for (const action of state.config.actions) {
          if (action.kind === "switch" && action.need) action.need.enabled = true;
        }
        state.config.routing = { ...state.config.routing, service: "waze" };
      }
      state.plan = done && state.mode !== "off" ? history.plan : null;
      let adopted = done;
      const listeners = new Set();
      const push = () => listeners.forEach((cb) => cb(structuredClone({ ...state, control: controlView() })));

      const hass = {
        ...sample.hass,
        language: params.get("lang") || "de",
        themes: { darkMode: params.get("dark") === "1" },
        config: { currency: "EUR", time_zone: "Europe/Berlin" },
        services: { notify: { mobile_app_handy: {}, persistent_notification: {}, send_message: {} } },
        async callApi(method, path, data) {
          (state.apiCalls = state.apiCalls ?? []).push({ method, path, data });
          return { result: "ok" };
        },
        async callService(domain, service, data) {
          if (domain === "device_tracker" && service === "see") {
            const id = `device_tracker.${data.dev_id}`;
            hass.states[id] = { entity_id: id, state: data.location_name, attributes: { friendly_name: data.host_name } };
          }
          if (domain === "input_boolean") {
            hass.states[data.entity_id] = { ...hass.states[data.entity_id], state: service === "turn_on" ? "on" : "off" };
            push();
          }
        },
        async callWS(msg) {
          switch (msg.type) {
            case "energy_joe/info":
              return {
                version: "0.1.0",
                ha_version: "2026.9.4",
                energy: {
                  available: true,
                  configured: Boolean(sample.discovery.energy_dashboard.configured),
                  sources: { grid: 1, solar: 4, battery: 1, gas: 0, water: 0 },
                  devices: 29,
                },
                defaults: { rules: sample.default_config.rules },
                profiles: sample.profiles,
                routing: { waze: true, google: [{ entry_id: "google1", title: "Google Maps" }] },
              };
            case "energy_joe/places/set": {
              // A corrected distance: the trips to this place get it (there and back).
              for (const action of state.plan?.actions ?? []) {
                for (const trip of action.need?.trips ?? []) {
                  if (trip.location === msg.location) {
                    trip.km = msg.km == null ? null : msg.km * 2;
                    trip.source = msg.km == null ? null : "user";
                  }
                }
                if (action.need) {
                  action.need.trips_km = action.need.trips.reduce((sum, t) => sum + (t.km ?? 0), 0);
                }
              }
              push();
              return null;
            }
            case "energy_joe/set_mode":
              state.mode = msg.mode;
              state.observe =
                state.onboarding.completed && msg.mode !== "off" ? watching() : { ...state.observe, active: false };
              state.plan = state.onboarding.completed && msg.mode !== "off" ? history.plan : null;
              push();
              return null;
            case "energy_joe/history/days":
              return { ...history, views: undefined, days: history.days.slice(0, msg.days || 14) };
            case "energy_joe/history/day":
              return (
                history.views[msg.date] ?? {
                  date: msg.date,
                  slots: Array.from({ length: 24 }, (_, h) => `${String(h).padStart(2, "0")}:00`),
                  hours: [],
                  fc: {},
                  fc_slots: [],
                  fc_ahead_slots: [],
                  workday: null,
                  summary: { date: msg.date, hours: 0, expected: 24, cov: 0, sources: {} },
                  window: null,
                  window_slots: [],
                  sun: {},
                }
              );
            case "energy_joe/plan/refresh":
              if (!state.plan) throw { code: "not_planning" };
              state.plan = { ...history.plan, created: stamp() };
              push();
              return state.plan;
            case "energy_joe/history/rebuild":
              if (!state.observe.active) throw { code: "not_observing" };
              state.observe = { ...state.observe, backfill: { state: "running" } };
              push();
              setTimeout(() => {
                state.observe = watching();
                push();
              }, 1500);
              return null;
            case "energy_joe/discover":
              return sample.discovery;
            case "energy_joe/adopt":
              await new Promise((resolve) => setTimeout(resolve, 900));
              if (!adopted) {
                state.config = structuredClone(sample.adopted_config);
                adopted = true;
                push();
              }
              return { discovery: sample.discovery, checks: sample.checks };
            case "energy_joe/check":
              return { checks: sample.checks };
            case "energy_joe/config/update": {
              state.config = applyUpdate(state.config, msg.patch, msg.source || "user");
              // A starting value gives way to what Joe learned (model.prefer_learned).
              const learned = state.config.learned?.buffer;
              if (learned != null && bufferSource() === "default" && state.config.rules.buffer_factor !== learned) {
                state.config = applyUpdate(state.config, { rules: { buffer_factor: learned } }, "learned");
              }
              push();
              return null;
            }
            case "energy_joe/learning":
              return {
                ...history.learning,
                // After a reset Joe only learns from new days.
                accuracy: state.config.learned.since ? [] : history.learning.accuracy,
                solar: state.config.learned.since ? [] : history.learning.solar,
                solar_profile: state.config.learned.since ? null : history.learning.solar_profile,
                days: state.config.learned.since ? [] : history.learning.days,
                questions: state.questions,
                learned: state.config.learned,
                buffer: {
                  value: state.config.rules.buffer_factor,
                  source: bufferSource(),
                  default: sample.default_config.rules.buffer_factor,
                },
                results: state.results,
              };
            case "energy_joe/control/test": {
              const battery = state.config.batteries.find((b) => b.id === msg.battery_id);
              if (!battery) throw { code: "unknown_battery" };
              if (control.testing) throw { code: "busy" };
              const soc = Number(sample.hass.states[battery.soc_entity]?.state ?? 50);
              control.testing = { battery: battery.id, step: "hold", steps: [], started: stamp() };
              push();
              const step = (name, power) => ({ step: name, ok: true, errors: [], wrong: [], power, writes: [] });
              const steps = [step("hold", 0), step("charge", 0.48), step("release", 0)];
              steps.forEach((s, i) =>
                setTimeout(() => {
                  control.testing.steps = steps.slice(0, i + 1);
                  control.testing.step = steps[i + 1]?.step ?? "release";
                  if (i === steps.length - 1) {
                    control.tests[battery.id] = { at: stamp(), signature: "dev", ok: true, steps, soc };
                    control.testing = null;
                    log("test", { battery: battery.id, ok: true });
                  }
                  push();
                }, 1500 * (i + 1)),
              );
              return { started: true };
            }
            case "energy_joe/control/release":
              log("emergency");
              log("released", { reason: "emergency" });
              control.skip = state.plan?.window?.start ?? null;
              push();
              return null;
            case "energy_joe/control/skip":
              control.skip = msg.skip ? (state.plan?.window?.start ?? null) : null;
              log(msg.skip ? "skip" : "unskip");
              push();
              return null;
            case "energy_joe/control/action_tonight": {
              control.tonight_target = control.tonight_target ?? {};
              const night = state.plan?.window?.start;
              if (msg.on && night) control.tonight[msg.action_id] = night;
              else delete control.tonight[msg.action_id];
              if (msg.on && night && msg.target != null) {
                const car = state.config.actions.find((a) => a.id === msg.action_id);
                const reserve = msg.unit === "km" ? (car?.need?.reserve_km ?? 50) : 0;
                const sensor = msg.unit === "km" ? car?.need?.range_entity : car?.need?.soc_entity;
                control.tonight_target[msg.action_id] = { night, target: msg.target + reserve, chosen: msg.target, unit: msg.unit, sensor };
              } else delete control.tonight_target[msg.action_id];
              log("tonight", { battery: `action:${msg.action_id}`, on: msg.on });
              push();
              return null;
            }
            case "energy_joe/control/boost": {
              control.boost = control.boost ?? {};
              control.actions = control.actions ?? {};
              if (msg.target == null) {
                delete control.boost[msg.action_id];
                delete control.actions[msg.action_id];
                log("boost_end", { battery: `action:${msg.action_id}`, reason: "stopped" });
              } else {
                const action = state.config.actions.find((a) => a.id === msg.action_id);
                const reserve = msg.unit === "km" ? (action?.need?.reserve_km ?? 50) : 0;
                const sensor = msg.unit === "km" ? action?.need?.range_entity : action?.need?.soc_entity;
                const until = new Date(Date.now() + 86400000).toISOString();
                control.boost[msg.action_id] = { target: msg.target + reserve, chosen: msg.target, unit: msg.unit, sensor, since: stamp(), until };
                const value = Number.parseFloat(hass.states[sensor]?.state);
                control.actions[msg.action_id] = { on: true, reason: "boost", start: stamp(), end: until, target: msg.target + reserve, chosen: msg.target, unit: msg.unit, value: Number.isFinite(value) ? value : null, problem: null };
                log("boost", { battery: `action:${msg.action_id}`, target: msg.target, unit: msg.unit });
              }
              push();
              return null;
            }
            case "energy_joe/calendar/links": {
              if (msg.renew || !state.calendarToken) state.calendarToken = Math.random().toString(36).slice(2, 14);
              const cars = state.config.actions.filter((a) => a.kind === "switch" && a.need?.enabled && a.need?.source === "mailbox");
              return {
                external_url: "https://ha.example.com",
                links: Object.fromEntries(cars.map((a) => [a.id, `/api/energy_joe/calendar/${state.calendarToken}/${a.id}.ics`])),
                entities: Object.fromEntries(cars.map((a) => [a.id, `calendar.energy_joe_kalender_${a.id}`])),
              };
            }
            case "energy_joe/mailbox/secret":
              state.mailbox = state.mailbox ?? {};
              state.mailbox[msg.car] = { ...(state.mailbox[msg.car] ?? { state: "waiting" }), has_secret: Boolean(msg.password), state: msg.password ? "ok" : "no_secret", checked: stamp() };
              push();
              return null;
            case "energy_joe/account": {
              state.accounts = state.accounts ?? {};
              const current = state.accounts[msg.car] ?? {};
              if (msg.do === "password") state.accounts[msg.car] = { ...current, has_secret: Boolean(msg.password), state: "waiting" };
              if (msg.do === "sign_out") state.accounts[msg.car] = { has_secret: false, state: "no_secret", oauth: null };
              if (msg.do === "test") {
                state.accounts[msg.car] = { ...current, state: current.has_secret ? "ok" : "error", error: current.has_secret ? null : "no_secret", checked: stamp() };
                push();
                return { error: current.has_secret ? null : "no_secret" };
              }
              if (msg.do === "sign_in") {
                const info = { state: "waiting", user_code: "KONA-2026", uri: "https://microsoft.com/devicelogin" };
                state.accounts[msg.car] = { ...current, oauth: info };
                push();
                setTimeout(() => {
                  state.accounts[msg.car] = { ...state.accounts[msg.car], oauth: { state: "ok" }, has_secret: true, state: "ok", checked: stamp() };
                  push();
                }, 3000);
                return info;
              }
              push();
              return null;
            }
            case "energy_joe/mailbox/test":
              return { error: state.mailbox?.[msg.car]?.has_secret ? null : "no_secret" };
            case "energy_joe/mailbox/check":
              state.mailbox = state.mailbox ?? {};
              state.mailbox[msg.car] = {
                ...(state.mailbox[msg.car] ?? {}),
                state: "ok",
                checked: stamp(),
                recent: [
                  { at: stamp(), summary: "Kundentermin", start: "2026-10-06T14:00:00+02:00", from: "kim@firma.example", organizer: "kim@firma.example", method: "REQUEST", result: "added_accepted" },
                  { at: stamp(), summary: "Gewinnspiel", start: null, from: "fremd@spam.example", organizer: null, method: "REQUEST", result: "not_allowed" },
                ],
              };
              push();
              return state.mailbox[msg.car];
            case "energy_joe/config/export":
              return { kind: "energy_joe_settings", exported: stamp(), config: structuredClone(state.config) };
            case "energy_joe/config/import":
              state.config = structuredClone(msg.config);
              push();
              return { ok: true };
            case "input_boolean/create": {
              const id = "gastmodus";
              hass.states[`input_boolean.${id}`] = { entity_id: `input_boolean.${id}`, state: "off", attributes: { friendly_name: msg.name } };
              return { id, name: msg.name };
            }
            case "energy_joe/presence/create": {
              const entity = "binary_sensor.jemand_zu_hause";
              hass.states[entity] = { entity_id: entity, state: "on", attributes: { friendly_name: msg.name, device_class: "presence" } };
              state.config.context = { ...state.config.context, presence_entity: entity };
              push();
              return { entity_id: entity };
            }
            case "energy_joe/climate/devices": {
              const via = "Shelly Pro 3EM HV Gerätemessungen";
              const meters = [
                { device_id: "dev_a", name: "Klimaanlage Büro", sensor: null, via, area: "Büro", power: "sensor.klima_buero_leistung", energy: "sensor.klima_buero_energie" },
                { device_id: "dev_b", name: "Klimaanlage Schlafzimmer", sensor: null, via, area: "Schlafzimmer", power: "sensor.klima_schlafzimmer_leistung", energy: "sensor.klima_schlafzimmer_energie" },
                { device_id: "dev_c", name: "Waschmaschine", sensor: null, via: null, area: "Keller", power: "sensor.waschmaschine_leistung", energy: null },
              ];
              for (const [id, value, unit] of [["sensor.klima_buero_leistung", "412", "W"], ["sensor.klima_buero_energie", "183.4", "kWh"], ["sensor.klima_schlafzimmer_leistung", "0", "W"], ["sensor.klima_schlafzimmer_energie", "96.1", "kWh"], ["sensor.waschmaschine_leistung", "3", "W"]]) {
                hass.states[id] = { entity_id: id, state: value, attributes: { unit_of_measurement: unit } };
              }
              return {
                meters,
                suggested: { "climate.buero": meters[0], "climate.schlafzimmer": meters[1] },
                devices: [
                  { entity_id: "climate.wohnzimmer", name: "Heizgruppe Wohnzimmer", area: "Wohnzimmer", state: "auto", hvac_modes: ["auto", "heat", "off"], preset_modes: ["boost", "eco", "Standard", "Abwesend", "Feiertag"], temperature: 21, current_temperature: 20.5, platform: "homematicip_cloud" },
                  { entity_id: "climate.buero", name: "Klimaanlage Büro", device_id: "ac1", device_name: "Klimaanlage Büro", area: "Büro", state: "cool", hvac_modes: ["off", "cool", "heat", "dry", "fan_only"], preset_modes: [], temperature: 23, current_temperature: 25.2, platform: "daikin" },
                  { entity_id: "climate.schlafzimmer", name: "Klimaanlage Schlafzimmer", device_id: "ac2", device_name: "Klimaanlage Schlafzimmer", area: "Schlafzimmer", state: "off", hvac_modes: ["off", "cool", "heat"], preset_modes: [], temperature: 22, current_temperature: 23.1, platform: "daikin" },
                ],
                arrivals: { "person.marcel": { km: 12.4, direction: "towards" } },
                proximity: true,
              };
            }
            case "energy_joe/automations":
            case "energy_joe/automations/switch": {
              // Two automations in the style of a real setup (interlock and boost).
              const list = (state.automationsMock = state.automationsMock ?? [
                { entity_id: "automation.akku_interlock_r3", name: "Akku-Interlock R3: BYD-Entladen zu, wenn Venus lädt", on: true, writes: [{ entity_id: "number.discharge_limit", name: "Grenzwert für die Entladeleistung", battery: state.config.batteries[0]?.name ?? "BYD" }], switched_off: null },
                { entity_id: "automation.akku_boost_r5", name: "Akku-Boost R5: Venus parallel laden", on: true, writes: [{ entity_id: "number.charge_power", name: "Ladeleistung", battery: state.config.batteries[1]?.name ?? "Venus" }, { entity_id: "select.force_mode", name: "Betriebsmodus erzwingen", battery: state.config.batteries[1]?.name ?? "Venus" }], switched_off: null },
              ]);
              if (msg.type.endsWith("/switch")) {
                for (const item of list) {
                  if (msg.on && item.switched_off) Object.assign(item, { on: true, switched_off: null });
                  if (!msg.on && item.on) Object.assign(item, { on: false, switched_off: { at: stamp(), reason: "battery" } });
                  hass.states[item.entity_id] = { entity_id: item.entity_id, state: item.on ? "on" : "off", attributes: { friendly_name: item.name } };
                }
                push();
                return { failed: [], automations: list };
              }
              return list;
            }
            case "energy_joe/control/answer":
              control.answer = { night: msg.night, yes: msg.yes, at: stamp() };
              log("answer", { night: msg.night, yes: msg.yes });
              push();
              return null;
            case "energy_joe/learning/answer": {
              if (!state.observe.active) throw { code: "not_learning" };
              state.questions = state.questions.filter((q) => q.date !== msg.date);
              const day = history.learning.days.find((d) => d.date === msg.date);
              if (day) {
                day.answer = msg.answer;
                day.excluded = msg.answer !== "normal";
              }
              push();
              return null;
            }
            case "energy_joe/learning/reset": {
              if (!state.observe.active) throw { code: "not_learning" };
              const now = stamp();
              // What a reset forgets, by area (learn/learner.py SCOPES).
              const areas = {
                forecast: { solar_factor: null, solar_days: 0, solar_shift: null, shift_days: 0, solar_classes: {}, sources: {} },
                consumption: { consumption_model: null, group_models: {}, presence: {}, buffer: null, buffer_days: 0 },
                battery: { battery_models: {} },
                hot_water: { action_models: {} },
                car: { car_models: {} },
              };
              const scope = msg.scope ?? "all";
              if (scope !== "all") {
                const reset = { ...(state.config.learned.reset ?? {}), [scope]: now };
                state.config = applyUpdate(state.config, { learned: { ...areas[scope], reset, updated: now } }, "default");
                if (scope === "consumption") state.questions = [];
                if (scope === "consumption" && bufferSource() === "learned") {
                  state.config = applyUpdate(
                    state.config,
                    { rules: { buffer_factor: sample.default_config.rules.buffer_factor } },
                    "default",
                  );
                }
                push();
                return null;
              }
              const fresh = Object.assign({}, ...Object.values(areas));
              state.config = applyUpdate(state.config, { learned: { ...fresh, since: now, updated: now, reset: {} } }, "default");
              state.questions = [];
              if (bufferSource() === "learned") {
                state.config = applyUpdate(
                  state.config,
                  { rules: { buffer_factor: sample.default_config.rules.buffer_factor } },
                  "default",
                );
              }
              state.results = { since: now, first: null, days: 0, saving: 0, better: 0, worse: 0, last: null, daily: [] };
              push();
              return null;
            }
            case "energy_joe/onboarding":
              if (msg.step) state.onboarding.step = msg.step;
              if ("completed" in msg) state.onboarding.completed = msg.completed;
              if (state.onboarding.completed && state.mode !== "off") {
                state.observe = watching();
                state.plan = history.plan;
              }
              push();
              return null;
          }
          throw new Error(`Unbekannter Befehl ${msg.type}`);
        },
        connection: {
          async subscribeMessage(cb) {
            listeners.add(cb);
            setTimeout(() => cb(structuredClone({ ...state, control: controlView() })));
            return async () => listeners.delete(cb);
          },
        },
      };

      await import("../../custom_components/energy_joe/frontend/energy-joe-panel.js");
      const panel = document.querySelector("energy-joe-panel");
      const routeFromPage = (page) => ({ prefix: "/energy-joe", path: page ? `/${page}` : "" });
      panel.hass = hass;
      panel.narrow = window.innerWidth < 870;
      panel.route = routeFromPage(params.get("page"));
      window.addEventListener("location-changed", () => {
        const page = location.pathname.replace(/^\/energy-joe\/?/, "");
        panel.route = routeFromPage(page);
      });
      window.joeState = state;

      // Tooltip check: every control needs an explanation or must be plain navigation.
      const CONTROLS =
        "button, input, select, textarea, summary, [role=radio], [role=checkbox], [role=switch], [role=option], [role=slider]";
      const up = (node) => node.parentElement ?? node.getRootNode().host ?? null;
      const covered = (el) => {
        for (let node = el; node; node = up(node)) {
          if (node.localName === "joe-tip" || node.hasAttribute("data-tipped") || node.hasAttribute("data-notip")) {
            return true;
          }
        }
        return false;
      };
      const deep = (root) =>
        [...root.querySelectorAll("*")].flatMap((el) => (el.shadowRoot ? [el, ...deep(el.shadowRoot)] : [el]));
      const describe = (el) =>
        `${el.localName}: ${(el.textContent || el.getAttribute("aria-label") || "").trim().replace(/\s+/g, " ").slice(0, 50)}`;
      let marked = [];
      window.joeAudit = () => {
        const all = deep(panel.shadowRoot);
        const visible = (el) => el.getClientRects().length > 0;
        const missing = all.filter((el) => el.matches(CONTROLS) && visible(el) && !covered(el));
        const empty = all.filter(
          (el) => el.hasAttribute("data-tipped") && visible(el) && !deep(el).some((x) => x.localName === "joe-tip"),
        );
        marked.forEach((el) => (el.style.outline = ""));
        marked = [...missing, ...empty];
        marked.forEach((el) => (el.style.outline = "3px dashed #e00"));
        return { missing: missing.map(describe), empty: empty.map(describe) };
      };
      if (params.get("audit") === "1") {
        setInterval(window.joeAudit, 1000);
      }
    </script>
  </body>
</html>
