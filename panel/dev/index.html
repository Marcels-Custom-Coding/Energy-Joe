<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Energy Joe – Panel ohne Home Assistant</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      energy-joe-panel {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Zeigt das gebaute Panel mit einem nachgeahmten Home Assistant.
      Aufruf über einen lokalen Webserver im Repo-Wurzelverzeichnis, z. B.
      python3 -m http.server 8767  →  http://localhost:8767/panel/dev/
      Parameter: ?dark=1  ?lang=en  ?step=scan  ?done=1  ?page=settings  ?mode=off|advisory|live  ?sample=generic  ?audit=1  ?need=1  ?presence=0  ?climate=1
      ?page=<Adresse> ohne Präfix, z. B. review/days, devices/climate/climate.buero, household/people;
      alte Werte (history, learn, climate) leiten um. Jeder Sprung im Panel schreibt die Adresse zurück in ?page=,
      damit Neuladen und Zurück funktionieren.
      ?override=manual|off (Klimaanlage Büro von Hand verstellt bzw. ausgeschaltet)
      ?away=1 (niemand da)  ?labels=unread|error (Kalender noch nicht gelesen bzw. nicht erreichbar)
      ?manual=1 (Heizgruppe Kinderzimmer von Hand auf „Heizen“)
      ?steer=1 (Joe steuert gerade: Speicher laden/halten, Auto läuft, „Sofort freigeben“ auf der Übersicht)
      ?climate=profiles (Büro mit Wochenprofilen, Kinderzimmer mit Geräteprogrammen, Wohnzimmer alt: Übersicht › Heizung & Klima)
      ?pnotes=1 (Plan: alle Hinweise mit Sprung, Warmwasser und eigene Geräte heute Nacht, ein Speicher ohne Größe)
      ?joe_entities=0|1 (Joes eigene Entitäten in HA für Einstellungen › Über Joe; mit ?done=1 schon an)
      sample-*.json kommen aus scripts/make_dev_samples.py (erfundene Haushalte aus tests/snapshots.py):
      Funde, die Konfiguration nach dem Übernehmen, ihre Prüfungen, Zustände und Register sowie
      zwei Wochen erfundener Verlauf mit festen Plänen, nachgespielten Nächten und dem, was Joe
      daraus gelernt hat (Seiten Übersicht, Plan, Historie, Lernen).
      ?done=1 startet mit übernommener Konfiguration (mit Kalendern je Person und dem Helfer
      „Jemand zu Hause“; ?presence=0 lässt den Helfer weg).
      ?audit=1 rahmt jedes Bedienelement rot ein, das keinen Tooltip hat; joeAudit() in der
      Konsole listet sie auf. Ein Element gilt als erklärt, wenn es oder ein Vorfahr
      data-tipped (Container mit <joe-tip>) oder data-notip (reine Navigation) trägt.
      joeTargets() listet sichtbare Bedienelemente und Links unter 44×44 px (Links im Fließtext zählen nicht;
      am Handy mit Touch-Emulation prüfen, dann gelten die größeren Ziele aus "pointer: coarse").
      joeOverflow() ist true, wenn die Seite waagrecht scrollt.
    -->
    <energy-joe-panel></energy-joe-panel>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const sample = await (await fetch(`./sample-${params.get("sample") || "fronius"}.json`, { cache: "no-store" })).json();

      // Stand-ins for elements Home Assistant provides.
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          connectedCallback() {
            this.style.cssText =
              "display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);border-radius:50%;background:currentColor;opacity:.4";
          }
        },
      );
      customElements.define("ha-menu-button", class extends HTMLElement {});

      // The same merge rules as custom_components/energy_joe/model.py (simplified).
      const KEYED = ["batteries", "persons", "consumers", "actions"];
      const REPLACED = new Set([
        "grid_power",
        "home_power",
        "power",
        "controls",
        "mode_options",
        "window",
        "steps",
        "prepare",
        "consumption_model",
        "group_models",
        "presence",
        "solar_classes",
        "sources",
        "battery_models",
        "action_models",
        "reset",
        "alternatives",
        "modes",
        "device_profiles",
      ]);
      const ITEM_DEFAULTS = {
        batteries: {
          power: null,
          capacity_kwh: null,
          capacity_entity: null,
          max_charge_w: null,
          max_discharge_w: null,
          device_id: null,
          controls: {},
          priority: 1,
        },
        persons: { person_entity: null, calendars: [] },
        consumers: { energy_entity: null, power_entity: null, included_in: null, source: "manual" },
        actions: { enabled: true, reset: "previous", reset_value: null, lead_min: 0, auto: true, conditions: [], priority: 1 },
      };
      const isDict = (v) => v && typeof v === "object" && !Array.isArray(v);
      const below = (other, path) => other.startsWith(`${path}.`) || other.startsWith(`${path}[`);
      const forget = (prov, path) =>
        Object.keys(prov)
          .filter((k) => below(k, path))
          .forEach((k) => delete prov[k]);
      const merge = (base, patch) => {
        for (const [k, v] of Object.entries(patch)) {
          if (isDict(v) && isDict(base[k]) && Object.keys(v).length && !REPLACED.has(k)) merge(base[k], v);
          else base[k] = structuredClone(v);
        }
        return base;
      };
      const leaves = (patch, prefix = "") =>
        Object.entries(patch).flatMap(([k, v]) =>
          isDict(v) && Object.keys(v).length && !REPLACED.has(k) ? leaves(v, `${prefix}${k}.`) : [`${prefix}${k}`],
        );
      const applyUpdate = (config, patch, source) => {
        const c = structuredClone(config);
        const prov = c.provenance;
        const paths = [];
        for (const [key, value] of Object.entries(patch)) {
          if (KEYED.includes(key) && isDict(value)) {
            for (const [id, change] of Object.entries(value)) {
              const prefix = `${key}[${id}]`;
              delete prov[prefix];
              const index = c[key].findIndex((item) => item.id === id);
              if (change === null) {
                if (index >= 0) c[key].splice(index, 1);
                forget(prov, prefix);
                paths.push(prefix);
              } else {
                if (index >= 0) merge(c[key][index], change);
                else c[key].push({ ...ITEM_DEFAULTS[key], ...structuredClone(change), id });
                const { id: _, ...fields } = change;
                paths.push(...leaves(fields, `${prefix}.`));
              }
            }
          } else if (KEYED.includes(key)) {
            c[key] = structuredClone(value);
            forget(prov, key);
            paths.push(key);
          } else {
            merge(c, { [key]: value });
            paths.push(...leaves({ [key]: value }));
          }
        }
        for (const path of paths) {
          forget(prov, path);
          prov[path] = { source, updated: new Date().toISOString() };
        }
        return c;
      };

      const done = params.get("done") === "1";
      const step = params.get("step") || "welcome";
      const state = {
        mode: params.get("mode") || "simulation",
        onboarding: { step, completed: done },
        config: structuredClone(done || ["questions", "done"].includes(step) ? sample.adopted_config : sample.default_config),
      };
      const history = sample.history;
      // Local time in Berlin (summer time) as Home Assistant would send it.
      const stamp = () => new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 19) + "+02:00";
      const bufferSource = () =>
        state.config.provenance["rules.buffer_factor"]?.source ?? state.config.provenance.rules?.source ?? "default";
      // With ?done=1 Joe has been learning for two weeks.
      if (done && history.learned) {
        state.config = applyUpdate(state.config, { learned: history.learned }, "learned");
        if (history.learned.buffer != null) {
          state.config = applyUpdate(state.config, { rules: { buffer_factor: history.learned.buffer } }, "learned");
        }
      }
      // Defaults of the climate settings (model.py, version 6); the samples are older.
      const withClimate = (config) => {
        config.climate = {
          enabled: false,
          night_by: "time",
          route_eta: true,
          night_entity: null,
          away_after_min: 15,
          rooms: {},
          ...(config.climate ?? {}),
        };
        config.context = { free_day_entities: [], ...config.context };
        return config;
      };
      withClimate(state.config);
      // ?devices=rich: a car on the wallbox meter charging by need, hot water heating to a target on its meter,
      // a dishwasher running on cheap power and switched on at night, a pool pump without a meter.
      if (params.get("devices") === "rich") {
        const c = state.config;
        const base = { enabled: true, on_value: "on", reset: "previous", reset_value: null, lead_min: 0, auto: true, forecast_below_kwh: null, conditions: [], power_kw: null, power_entity: null, priority: 3, sensor_entity: null, comfort: 45, maximum: 62, buffer: 3 };
        const ev = c.actions.find((a) => a.id === "ev_carport");
        if (ev) {
          ev.consumer_id = "sensor.wallbox_energy";
          ev.need = { ...ev.need, enabled: true, capacity_kwh: 60 };
        }
        c.consumers.push({ id: "sensor.dishwasher_energy", name: "Spülmaschine", kind: "household", energy_entity: "sensor.dishwasher_energy", power_entity: null, included_in: "sensor.house_energy", source: "energy_dashboard", runs: "cheap" });
        c.actions.push(
          { ...base, id: "hot_water_tank", name: "Warmwasser", kind: "target", entity_id: "switch.ww_boost", sensor_entity: "sensor.ww_speicher_temperatur", consumer_id: "sensor.hot_water_energy", forecast_below_kwh: 20, power_kw: 0.5, priority: 2 },
          { ...base, id: "custom_dishwasher", name: "Spülmaschine nachts", kind: "switch", entity_id: "switch.inverter_charge_limit_enabled", consumer_id: "sensor.dishwasher_energy" },
          { ...base, id: "custom_pool", name: "Poolpumpe", kind: "switch", entity_id: "switch.inverter_grid_charging", consumer_id: null },
        );
      }
      // ?done=1 (Geräte): a second wallbox meter without a night action ("Laden einrichten"), a meter on a
      // climate device that is not in the climate list ("Nicht zugeordnet"), and a battery Joe found but
      // does not use yet ("Neu gefunden").
      const lean = params.get("devices") === "lean";
      if (done && !lean) {
        const c = state.config;
        c.consumers.push(
          { id: "sensor.garage_wallbox_energy", name: "Wallbox Garage", kind: "ev", energy_entity: "sensor.garage_wallbox_energy", power_entity: null, included_in: "sensor.house_energy", source: "energy_dashboard", runs: "auto" },
          { id: "sensor.ac_attic_energy", name: "Klimagerät Dachboden", kind: "climate", energy_entity: "sensor.ac_attic_energy", power_entity: null, included_in: "sensor.house_energy", source: "energy_dashboard", runs: "auto" },
        );
        const venus = sample.discovery.batteries.find((b) => b.id === "venus");
        if (venus && !sample.discovery.batteries.some((b) => b.id === "solarflow")) {
          sample.discovery.batteries.push({
            ...structuredClone(venus),
            id: "solarflow",
            name: "Zendure SolarFlow 800",
            device_id: "solarflow",
            integration: "zendure_ha",
            soc: { ...venus.soc, entity_id: "sensor.solarflow_soc", name: "SolarFlow Ladezustand", device: "Zendure SolarFlow 800", value: 55, integration: "zendure_ha" },
            soc_entity: "sensor.solarflow_soc",
            power: { entity_id: "sensor.solarflow_power", invert: false, minus_entity_id: null },
            capacity_kwh: 1.92,
            capacity_entity: null,
            max_charge_w: 800,
            adapter: "none",
            controls: {},
            mode_options: {},
            controllable: false,
            reasons: [{ code: "integration_key", integration: "zendure_ha" }, { code: "capacity_read" }],
          });
          sample.hass.states["sensor.solarflow_soc"] = { entity_id: "sensor.solarflow_soc", state: "55", attributes: { friendly_name: "SolarFlow Ladezustand", unit_of_measurement: "%", device_class: "battery" } };
          sample.hass.states["sensor.solarflow_power"] = { entity_id: "sensor.solarflow_power", state: "120", attributes: { friendly_name: "SolarFlow Leistung", unit_of_measurement: "W", device_class: "power" } };
        }
      }
      // ?devices=lean: one battery, no car – only the chips of what exists show up.
      if (lean) {
        const c = state.config;
        c.batteries = c.batteries.slice(0, 1);
        const cars = new Set(c.actions.filter((a) => a.need?.soc_entity || a.need?.range_entity).map((a) => a.id));
        c.actions = c.actions.filter((a) => !cars.has(a.id));
        c.consumers = c.consumers.filter((x) => x.kind !== "ev");
        sample.discovery.wallboxes = [];
        sample.discovery.cars = [];
      }
      // Checks (discovery/checks.py): with ?done=1 the grid meter's sign looks wrong right now, until it is
      // flipped ("Umdrehen") or confirmed ("Stimmt so").
      const gridInvert = state.config.measurements?.grid_power?.invert;
      const checksNow = () => {
        const grid = state.config.measurements?.grid_power;
        const settled = (state.config.answers?.confirmed ?? []).includes(`grid_sign:${grid?.entity_id}`);
        const sign = done && !lean && grid?.entity_id && grid.invert === gridInvert && !settled;
        return [...sample.checks, ...(sign ? [{ code: "grid_sign", level: "warn", entity_id: grid.entity_id, expected: -1.8, actual: 1.6 }] : [])];
      };
      // ?climate=1: heating & cooling switched on, the bedroom off at night (Haushalt › Nachtruhe lists it).
      if (params.get("climate") === "1") {
        const room = { enabled: true, away: "setback", setback_k: 3, away_preset: null, free_day_preset: null, night_from: "23:00", night_until: "06:30", week: { enabled: false, modes: {} }, device_profiles: {} };
        state.config.climate.enabled = true;
        state.config.climate.rooms = {
          "climate.buero": { ...room, night_off: false },
          "climate.schlafzimmer": { ...room, night_off: true, night_from: "22:30" },
        };
      }
      // ?climate=profiles (Übersicht › Heizung & Klima): three rooms with what runs and why – the office on
      // week profiles, the children's room on the device's own programs, the living room on the old settings.
      if (params.get("climate") === "profiles") {
        const room = { enabled: true, away: "setback", setback_k: 3, away_preset: null, free_day_preset: null, night_off: false, night_from: "23:00", night_until: "06:30", week: { enabled: false, modes: {} }, device_profiles: {} };
        const profile = (name, tags, value) => ({ name, tags, split: "all", curves: [[[0, value]]] });
        const cool = [profile("Normal", ["normal"], 24), profile("Feiertag", ["holiday"], 24), profile("Abwesend", ["away"], 27), profile("Home Office", ["home_office"], 23), profile("Profil 5", [], 24), profile("Profil 6", [], 24)];
        state.config.climate.enabled = true;
        state.config.climate.rooms = {
          "climate.wohnzimmer": { ...room },
          "climate.buero": { ...room, week: { enabled: true, modes: { cool } } },
          "climate.kinderzimmer": { ...room, device_profiles: { week_program_1: { name: "Schule", tags: ["normal"] }, week_program_2: { name: "Ferien", tags: ["holiday"] }, week_program_3: { name: "Weg", tags: ["away"] } } },
        };
      }
      // ?done=1: tonight's plan already knows tomorrow (household preview "Heute und morgen").
      if (done && history.plan?.meta?.tomorrow) {
        history.plan.meta.tomorrow.date = new Date(Date.now() + 2 * 3600e3 + 86400e3).toISOString().slice(0, 10);
      }
      state.results = done ? history.results : null;
      state.questions = done ? structuredClone(history.learning.questions) : [];
      // Each day carries its answer (observe/records.py): one answered, the asked one still open.
      for (const day of history.days) day.answer ??= null;
      const answerDay = (date, answer) => {
        for (const day of [...history.days, ...history.learning.days]) {
          if (day.date !== date) continue;
          day.answer = answer;
          if ("excluded" in day) day.excluded = answer !== "normal";
        }
      };
      if (!history.learning.questions.some((q) => q.date === "2026-09-30")) answerDay("2026-09-30", "guests");
      // ?done=1: everyone has a calendar, and the group "Jemand zu Hause" decides who is home.
      if (done && state.config.persons.length) {
        const calendars = Object.keys(sample.hass.states).filter((id) => id.startsWith("calendar."));
        for (const person of state.config.persons) {
          if (!person.calendars.length) person.calendars = calendars.filter((id) => id.endsWith("family")).slice(0, 1);
        }
        if (params.get("presence") !== "0") {
          const members = state.config.persons.map((p) => p.person_entity).filter(Boolean);
          const anyone = members.some((id) => sample.hass.states[id]?.state === "home");
          sample.hass.states["group.jemand_zu_hause"] = {
            entity_id: "group.jemand_zu_hause",
            state: anyone ? "home" : "not_home",
            attributes: { friendly_name: "Jemand zu Hause", entity_id: members },
          };
          state.config.context = { ...state.config.context, presence_entity: "group.jemand_zu_hause" };
        }
      }
      // Steering: test runs, log and why Joe steers or not (control/executor.py).
      const control = { tests: {}, log: [], skip: null, answer: null, testing: null, tonight: {} };
      const controlView = () => {
        const night = state.plan?.window?.start ?? null;
        const reason =
          state.mode === "simulation" || state.mode === "off"
            ? state.mode
            : !state.plan || state.plan.kind === "unavailable"
              ? "no_plan"
              : control.skip === night
                ? "skipped"
                : state.mode === "advisory" && control.answer?.night !== night
                  ? "unanswered"
                  : state.mode === "advisory" && !control.answer?.yes
                    ? "declined"
                    : "waiting";
        const ready = Object.fromEntries(
          state.config.batteries.map((b) => [
            b.id,
            b.adapter === "none" ? "not_controllable" : control.tests[b.id]?.ok ? "ready" : "not_tested",
          ]),
        );
        return { steering: false, reason, night, batteries: {}, actions: {}, pending: false, ready, ...control, log: control.log.slice(-30) };
      };
      const log = (kind, detail = {}) => {
        control.log.push({ at: stamp(), kind, ...detail });
        control.log = control.log.slice(-100);
      };
      // A day in Berlin (days back from today) at a time, as Home Assistant would send it.
      const dayAt = (back, time) => `${new Date(Date.now() + 2 * 3600e3 - back * 86400e3).toISOString().slice(0, 10)}T${time}:00+02:00`;
      // ?done=1: last night is in the log (control/executor.py keeps 100 entries).
      if (done) {
        const battery = state.config.batteries[0]?.id;
        const car = state.config.actions.find((a) => a.kind === "switch")?.id;
        control.log.push(
          { at: dayAt(1, "22:00"), kind: "start" },
          ...(battery ? [{ at: dayAt(1, "22:00"), kind: "set", battery, entity: state.config.batteries[0].controls?.grid_charge ?? state.config.batteries[0].soc_entity, value: "on" }] : []),
          ...(car ? [{ at: dayAt(1, "23:30"), kind: "action_on", battery: `action:${car}`, value: "an" }] : []),
          ...(battery ? [{ at: dayAt(0, "04:10"), kind: "reached", battery, target: 80 }] : []),
          ...(car ? [{ at: dayAt(0, "05:45"), kind: "action_done", battery: `action:${car}` }] : []),
          { at: dayAt(0, "06:00"), kind: "released" },
        );
      }
      // ?steer=1 (Übersicht › Gerade jetzt): Joe steers right now – the first battery charges, the second holds,
      // the car charges; "Sofort freigeben" shows up.
      if (params.get("steer") === "1") {
        const [first, second] = state.config.batteries;
        const car = state.config.actions.find((a) => a.kind === "switch");
        Object.assign(control, {
          steering: true,
          reason: "steering",
          batteries: {
            ...(first ? { [first.id]: { action: "charge", floor: 10, target: 80, soc: 46, problem: null } } : {}),
            ...(second ? { [second.id]: { action: "hold", floor: 35, target: 35, soc: 35, problem: null } } : {}),
          },
          actions: car ? { [car.id]: { on: true, reason: "plan", start: dayAt(0, "01:00"), end: dayAt(0, "05:30"), problem: null } } : {},
        });
      }
      const watching = () => ({
        active: true,
        since: "2026-10-01T09:12:00+02:00",
        last_hour: "2026-10-03T14:00:00+02:00",
        first_day: history.first_day,
        last_day: history.last_day,
        day_count: history.day_count,
        backfill: { state: "done", hours: 312 },
      });
      state.observe = done && state.mode !== "off" ? watching() : { active: false, backfill: { state: "idle" } };
      // ?need=1: the car charges by need (the night computed with made-up trips).
      if (params.get("need") === "1" && history.plan_need) {
        history.plan = history.plan_need;
        for (const action of state.config.actions) {
          if (action.kind === "switch" && action.need) action.need.enabled = true;
        }
        state.config.routing = { ...state.config.routing, service: "waze" };
      }
      // ?pnotes=1 (Plan): every plan note with its jump, hot water + own devices in tonight's plan, a battery without size.
      if (params.get("pnotes") === "1" && history.plan) {
        const p = history.plan;
        p.notes = ["capacity_unknown", "soc_unknown", "floor_unknown", "not_controllable", "no_forecast", "default_profile", "prices_partly", "balance_due"];
        const s0 = p.actions?.[0]?.start ?? p.window?.start, e0 = p.actions?.[0]?.end ?? p.window?.end;
        p.actions = [...(p.actions ?? []),
          { id: "hot_water_tank", name: "Warmwasser", kind: "target", run: true, manual: false, reasons: ["cheap"], start: s0, end: e0, power_kw: 0.5, energy_kwh: 1.5, cost: 0.4, priority: 2, target: 55, temperature: 42 },
          { id: "custom_dishwasher", name: "Spülmaschine nachts", kind: "switch", run: true, manual: false, reasons: ["cheap"], start: s0, end: e0, power_kw: 1.2, energy_kwh: 1.1, cost: 0.3, priority: 3 },
          { id: "custom_pool", name: "Poolpumpe", kind: "switch", run: false, manual: true, reasons: ["manual_only"], start: s0, end: e0, power_kw: null, energy_kwh: 0, priority: 3 },
          { id: "gone_action", name: "Altes Gerät mit sehr langem Namen zum Umbrechen", kind: "switch", run: false, manual: false, reasons: ["sun_enough"], start: s0, end: e0, power_kw: null, energy_kwh: 0, priority: 3 }];
        state.config.batteries.push({ ...structuredClone(state.config.batteries[1]), id: "nosize", name: "Speicher ohne Größe", capacity_kwh: null, capacity_entity: null, priority: 3 });
      }
      state.plan = done && state.mode !== "off" ? history.plan : null;
      let adopted = done;

      // Heating and cooling (control/climate.py, much simplified): devices, week profiles, what Joe would do.
      const climateDevices = [
        { entity_id: "climate.wohnzimmer", name: "Heizgruppe Wohnzimmer", area: "Wohnzimmer", state: "auto", hvac_modes: ["auto", "heat", "off"], preset_modes: ["boost", "eco", "Standard", "Abwesend", "Feiertag"], temperature: 21, current_temperature: 20.5, platform: "homematicip_cloud", week_presets: [], min_temp: 5, max_temp: 30, target_temp_step: 0.5 },

              return null;
            }
            case "energy_joe/mailbox/test":
              return { error: state.mailbox?.[msg.car]?.has_secret ? null : "no_secret" };
            case "energy_joe/mailbox/check":
              state.mailbox = state.mailbox ?? {};
              state.mailbox[msg.car] = {
                ...(state.mailbox[msg.car] ?? {}),
                state: "ok",
                checked: stamp(),
                recent: [
                  { at: stamp(), summary: "Kundentermin", start: "2026-10-06T14:00:00+02:00", from: "kim@firma.example", organizer: "kim@firma.example", method: "REQUEST", result: "added_accepted" },
                  { at: stamp(), summary: "Gewinnspiel", start: null, from: "fremd@spam.example", organizer: null, method: "REQUEST", result: "not_allowed" },
                ],
              };
              push();
              return state.mailbox[msg.car];
            case "energy_joe/config/export":
              return { kind: "energy_joe_settings", exported: stamp(), config: structuredClone(state.config) };
            case "energy_joe/config/import":
              state.config = withClimate(structuredClone(msg.config));
              push();
              return { ok: true };
            case "input_boolean/create": {
              const id = "gastmodus";
              hass.states[`input_boolean.${id}`] = { entity_id: `input_boolean.${id}`, state: "off", attributes: { friendly_name: msg.name } };
              return { id, name: msg.name };
            }
            case "energy_joe/presence/create": {
              const entity = "binary_sensor.jemand_zu_hause";
              hass.states[entity] = { entity_id: entity, state: "on", attributes: { friendly_name: msg.name, device_class: "presence" } };
              state.config.context = { ...state.config.context, presence_entity: entity };
              push();
              return { entity_id: entity };
            }
            case "energy_joe/climate/devices": {
              const via = "Shelly Pro 3EM HV Gerätemessungen";
              const meters = [
                { device_id: "dev_a", name: "Klimaanlage Büro", sensor: null, via, area: "Büro", power: "sensor.klima_buero_leistung", energy: "sensor.klima_buero_energie" },
                { device_id: "dev_b", name: "Klimaanlage Schlafzimmer", sensor: null, via, area: "Schlafzimmer", power: "sensor.klima_schlafzimmer_leistung", energy: "sensor.klima_schlafzimmer_energie" },
                { device_id: "dev_c", name: "Waschmaschine", sensor: null, via: null, area: "Keller", power: "sensor.waschmaschine_leistung", energy: null },
              ];
              for (const [id, value, unit] of [["sensor.klima_buero_leistung", "412", "W"], ["sensor.klima_buero_energie", "183.4", "kWh"], ["sensor.klima_schlafzimmer_leistung", "0", "W"], ["sensor.klima_schlafzimmer_energie", "96.1", "kWh"], ["sensor.waschmaschine_leistung", "3", "W"]]) {
                hass.states[id] = { entity_id: id, state: value, attributes: { unit_of_measurement: unit } };
              }
              return {
                meters,
                suggested: { "climate.buero": meters[0], "climate.schlafzimmer": meters[1] },
                devices: structuredClone(climateDevices),
                arrivals: climateArrivals(),
                proximity: true,
              };
            }
            case "energy_joe/climate/week/default": {
              const device = climateDevices.find((d) => d.entity_id === msg.entity_id);
              if (!device) throw { code: "not_found", message: "Unbekanntes Gerät" };
              const room = state.config.climate.rooms[msg.entity_id] ?? {};
              const value = device.state === msg.mode && device.temperature != null ? device.temperature : msg.mode === "cool" ? 25 : 21;
              const minute = (text) => {
                const [h, m] = text.split(":").map(Number);
                return Math.round((h * 60 + m) / 5) * 5;
              };
              let normal = [[0, value]];
              if (room.night_off) {
                const from = minute(room.night_from ?? "23:00");
                const until = minute(room.night_until ?? "06:30");
                const points = new Map([[0, from > until ? "off" : value], [from, "off"], [until, value]]);
                normal = [...points].sort((a, b) => a[0] - b[0]);
              }
              const setback = room.setback_k ?? 3;
              const fit = (v) => {
                const step = device.target_temp_step || 0.5;
                const low = Math.max(5, device.min_temp ?? 5);
                const high = Math.min(35, device.max_temp ?? 35);
                return Math.round(Math.min(high, Math.max(low, Math.round(v / step) * step)) * 10) / 10;
              };
              const setbackValue = room.away === "off" ? "off" : fit(msg.mode === "cool" ? value + setback : value - setback);
              const profile = (name, tags, curve) => ({ name, tags, split: "all", curves: [structuredClone(curve)] });
              return {
                profiles: [
                  profile("Normal", ["normal"], normal),
                  profile("Feiertag", ["holiday"], normal),
                  profile("Abwesend", ["away"], [[0, setbackValue]]),
                  profile("Home Office", climateDay().home_office_available ? ["home_office"] : [], normal),
                  profile("Profil 5", [], normal),
                  profile("Profil 6", [], normal),
                ],
              };
            }
            case "energy_joe/climate/week/set": {
              const problem = weekProblem(msg.profiles);
              if (problem) throw { code: "invalid_week", message: problem };
              const modes = { ...(state.config.climate.rooms[msg.entity_id]?.week?.modes ?? {}), [msg.mode]: msg.profiles };
              state.config = applyUpdate(state.config, { climate: { rooms: { [msg.entity_id]: { week: { modes } } } } }, "user");
              push();
              return { ok: true };
            }
            case "energy_joe/climate/week/hold": {
              const device = climateDevices.find((d) => d.entity_id === msg.entity_id);
              const mode = ["heat", "cool"].includes(device?.state) ? device.state : "cool";
              const midnight = new Date();
              midnight.setHours(24, 0, 0, 0);
              if (msg.profile == null) delete climateMock.holds[msg.entity_id];
              else climateMock.holds[msg.entity_id] = { profile: msg.profile, mode, until: msg.until === "forever" ? null : midnight.toISOString() };
              push();
              return { ok: true };
            }
            case "energy_joe/climate/week/resume":
              delete climateMock.overrides[msg.entity_id];
              push();
              return { ok: true };
            case "energy_joe/automations":
            case "energy_joe/automations/switch": {
              // Two automations in the style of a real setup (interlock and boost).
              const list = (state.automationsMock = state.automationsMock ?? [
                { entity_id: "automation.akku_interlock_r3", name: "Akku-Interlock R3: BYD-Entladen zu, wenn Venus lädt", on: true, writes: [{ entity_id: "number.discharge_limit", name: "Grenzwert für die Entladeleistung", battery: state.config.batteries[0]?.name ?? "BYD", battery_id: state.config.batteries[0]?.id ?? "storage", joe: true }], switched_off: null },
                { entity_id: "automation.akku_boost_r5", name: "Akku-Boost R5: Venus parallel laden", on: true, writes: [{ entity_id: "number.charge_power", name: "Ladeleistung", battery: state.config.batteries[1]?.name ?? "Venus", battery_id: state.config.batteries[1]?.id ?? "venus", joe: true }, { entity_id: "select.force_mode", name: "Betriebsmodus erzwingen", battery: state.config.batteries[1]?.name ?? "Venus", battery_id: state.config.batteries[1]?.id ?? "venus", joe: true }], switched_off: null },
              ].filter((item) => item.writes.every((w) => state.config.batteries.some((b) => b.id === w.battery_id))));
              if (msg.type.endsWith("/switch")) {
                for (const item of list) {
                  if (msg.entity_ids && !msg.entity_ids.includes(item.entity_id)) continue;
                  if (msg.on && item.switched_off) Object.assign(item, { on: true, switched_off: null });
                  if (!msg.on && item.on) Object.assign(item, { on: false, switched_off: { at: stamp(), reason: "battery" } });
                  hass.states[item.entity_id] = { entity_id: item.entity_id, state: item.on ? "on" : "off", attributes: { friendly_name: item.name } };
                }
                push();
                return { failed: [], automations: list };
              }
              return list;
            }
            case "energy_joe/control/answer":
              control.answer = { night: msg.night, yes: msg.yes, at: stamp() };
              log("answer", { night: msg.night, yes: msg.yes });
              push();
              return null;
            case "energy_joe/learning/answer": {
              if (!state.observe.active) throw { code: "not_learning" };
              state.questions = state.questions.filter((q) => q.date !== msg.date);
              answerDay(msg.date, msg.answer);
              push();
              return null;
            }
            case "energy_joe/learning/reset": {
              const scope = msg.scope ?? "all";
              // The warm-up rates live with the heating (control/climate.py), learning or not.
              if (scope === "climate") {
                climateMock.rates = {};
                push();
                return null;
              }
              if (!state.observe.active) throw { code: "not_learning" };
              const now = stamp();
              // What a reset forgets, by area (learn/learner.py SCOPES).
              const areas = {
                forecast: { solar_factor: null, solar_days: 0, solar_shift: null, shift_days: 0, solar_classes: {}, sources: {} },
                consumption: { consumption_model: null, group_models: {}, presence: {}, buffer: null, buffer_days: 0 },
                battery: { battery_models: {} },
                hot_water: { action_models: {} },
                car: { car_models: {} },
              };
              if (scope !== "all") {
                const reset = { ...(state.config.learned.reset ?? {}), [scope]: now };
                state.config = applyUpdate(state.config, { learned: { ...areas[scope], reset, updated: now } }, "default");
                if (scope === "consumption") state.questions = [];
                if (scope === "consumption" && bufferSource() === "learned") {
                  state.config = applyUpdate(
                    state.config,
                    { rules: { buffer_factor: sample.default_config.rules.buffer_factor } },
                    "default",
                  );
                }
                push();
                return null;
              }
              const fresh = Object.assign({}, ...Object.values(areas));
              state.config = applyUpdate(state.config, { learned: { ...fresh, since: now, updated: now, reset: {} } }, "default");
              state.questions = [];
              if (bufferSource() === "learned") {
                state.config = applyUpdate(
                  state.config,
                  { rules: { buffer_factor: sample.default_config.rules.buffer_factor } },
                  "default",
                );
              }
              state.results = { since: now, first: null, days: 0, saving: 0, better: 0, worse: 0, last: null, daily: [] };
              climateMock.rates = {};
              push();
              return null;
            }
            case "energy_joe/onboarding":
              if (msg.step) state.onboarding.step = msg.step;
              if ("completed" in msg) state.onboarding.completed = msg.completed;
              if (state.onboarding.completed && state.mode !== "off") {
                state.observe = watching();
                state.plan = history.plan;
              }
              push();
              return null;
          }
          throw new Error(`Unbekannter Befehl ${msg.type}`);
        },
        connection: {
          async subscribeMessage(cb) {
            listeners.add(cb);
            setTimeout(() => cb(view()));
            return async () => listeners.delete(cb);
          },
        },
      };

      await import("../../custom_components/energy_joe/frontend/energy-joe-panel.js");
      const panel = document.querySelector("energy-joe-panel");
      const PREFIX = "/energy-joe";
      const routeFromPage = (page) => ({ prefix: PREFIX, path: page ? `/${page.replace(/^\/+/, "")}` : "" });
      // The harness lives at /panel/dev/; the panel's address travels in ?page= instead of the path.
      const DEV_PATH = location.pathname;
      const devUrl = (page) => {
        // The other parameters stay as the harness was opened (the panel's own push has no query).
        const next = new URLSearchParams(params);
        if (page) next.set("page", page);
        else next.delete("page");
        const query = next.toString().replace(/%2F/g, "/");
        return `${DEV_PATH}${query ? `?${query}` : ""}`;
      };
      panel.hass = hass;
      panel.narrow = window.innerWidth < 870;
      panel.route = routeFromPage(params.get("page"));
      window.addEventListener("location-changed", () => {
        if (!location.pathname.startsWith(PREFIX)) {
          // A jump into Home Assistant itself (e.g. "In HA öffnen"): note it and stay.
          window.joeHaOpened = location.pathname;
          console.info("Home Assistant would open", location.pathname);
          window.history.back();
          return;
        }
        const page = location.pathname.slice(PREFIX.length).replace(/^\/+/, "");
        window.history.replaceState(window.history.state, "", devUrl(page));
        panel.route = routeFromPage(page);
      });
      window.addEventListener("popstate", () => {
        panel.route = routeFromPage(new URLSearchParams(location.search).get("page"));
      });
      panel.addEventListener("hass-more-info", (ev) => {
        window.joeMoreInfo = ev.detail.entityId;
        console.info("Home Assistant would show", ev.detail.entityId);
      });
      window.joeState = state;

      // Tooltip check: every control needs an explanation or must be plain navigation.
      const CONTROLS =
        "button, input, select, textarea, summary, [role=radio], [role=checkbox], [role=switch], [role=option], [role=slider]";
      const up = (node) => node.parentElement ?? node.getRootNode().host ?? null;
      const covered = (el) => {
        for (let node = el; node; node = up(node)) {
          if (node.localName === "joe-tip" || node.hasAttribute("data-tipped") || node.hasAttribute("data-notip")) {
            return true;
          }
        }
        return false;
      };
      const deep = (root) =>
        [...root.querySelectorAll("*")].flatMap((el) => (el.shadowRoot ? [el, ...deep(el.shadowRoot)] : [el]));
      const describe = (el) =>
        `${el.localName}: ${(el.textContent || el.getAttribute("aria-label") || "").trim().replace(/\s+/g, " ").slice(0, 50)}`;
      let marked = [];
      window.joeAudit = () => {
        const all = deep(panel.shadowRoot);
        const visible = (el) => el.getClientRects().length > 0;
        const missing = all.filter((el) => el.matches(CONTROLS) && visible(el) && !covered(el));
        const empty = all.filter(
          (el) => el.hasAttribute("data-tipped") && visible(el) && !deep(el).some((x) => x.localName === "joe-tip"),
        );
        marked.forEach((el) => (el.style.outline = ""));
        marked = [...missing, ...empty];
        marked.forEach((el) => (el.style.outline = "3px dashed #e00"));
        return { missing: missing.map(describe), empty: empty.map(describe) };
      };
      // Touch targets: visible controls and links smaller than 44×44 px. Links inside running text
      // are exempt; a hidden input counts with its label; joe-tip widens its own hit area on touch.
      window.joeTargets = (min = 44) => {
        const all = deep(panel.shadowRoot);
        const small = [];
        for (const el of all) {
          if (!(el.matches(CONTROLS) || el.matches("a[href]")) || !el.getClientRects().length) continue;
          if (el.getRootNode().host?.localName === "joe-tip") continue;
          let box = el;
          if (el.matches("input") && el.closest("label")) box = el.closest("label");
          const style = getComputedStyle(box);
          if (el.matches("a[href]") && style.display === "inline") continue;
          if (style.visibility === "hidden" || style.display === "contents") continue;
          const rect = box.getBoundingClientRect();
          if (!rect.width || !rect.height) continue;
          if (rect.width < min - 0.5 || rect.height < min - 0.5) {
            small.push(`${describe(el)} (${Math.round(rect.width)}×${Math.round(rect.height)})`);
          }
        }
        return small;
      };
      // The panel scrolls itself, so sideways scrolling shows up on the page or on the panel.
      window.joeOverflow = () =>
        document.scrollingElement.scrollWidth > window.innerWidth || panel.scrollWidth > panel.clientWidth;
      if (params.get("audit") === "1") {
        setInterval(window.joeAudit, 1000);
      }
    </script>
  </body>
</html>
